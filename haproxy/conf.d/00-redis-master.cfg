# Redis Master 代理配置。
# 部署时请检查监听地址、Redis AUTH 健康检查和 Redis 节点地址。

frontend redis_master
    # HAProxy 对客户端提供的 Redis 监听地址和端口。
    bind [::]:6379
    default_backend redis_master_nodes

backend redis_master_nodes
    option tcp-check
    tcp-check connect

    # Redis AUTH 请求经过 RESP 编码后转换为十六进制字节。
    # 修改密码后，使用以下命令重新生成：
    # ./generate-auth-check.sh
    tcp-check send-binary 2a320d0a24340d0a415554480d0a2431330d0a7a687579616e6a756e2b3132330d0a
    tcp-check expect string +OK

    tcp-check send-binary 2a320d0a24340d0a494e464f0d0a2431310d0a7265706c69636174696f6e0d0a
    tcp-check expect string role:master
    tcp-check send-binary 2a310d0a24340d0a515549540d0a
    default-server check inter 1s fall 2 rise 1 on-marked-down shutdown-sessions

    # 在这里填写 Redis 节点的实际地址和端口。
    server redis-0 127.0.0.1:6380
    server redis-1 127.0.0.1:6381
